
<head> 

    <title>Dashboard - Ford</title>

</head>

<body>
    

<header>

    <app-menu></app-menu>
    
    <h1>Dashboard Ford</h1>

</header>


<main> 

    <div class="container-caixas">

        <div class="veiculo"> 

        <h3>Veiculos</h3>

        <select class="selecao-veiculos" (change)="veiculoSelecionado($event)">

            <option value="" hidden selected disabled>Escolha um Veículo</option>
            <option *ngFor="let v of vehicles" [value]= "v.id">

                {{v.vehicle}}

            </option>

        </select>
        
        
        
        </div>


        <div class="dashboard-caixas">

            <h3>Total de Vendas</h3>
            <span class="quantidades">{{selecionado?.volumetotal || 0}} </span>
            <span class="unidades">Unid.</span>

        </div>

        <div class="dashboard-caixas">

            <h3>Conectados</h3>
            <span class="quantidades">{{selecionado?.connected || 0}}</span>
            <span class="unidades">Unid.</span>
        
            
        </div>

        <div class="dashboard-caixas"> 

            <h3>Update Software</h3>
            <span class="quantidades">{{selecionado?.softwareUpdates || 0}}</span>
            <span class="unidades">Unid.</span>

        </div>

      

    </div>

          <div [ngStyle]="containerImagemCarro">        
            <img *ngIf="selecionado?.img" [src]= "selecionado?.img" [alt]="selecionado?.vehicle" [ngStyle]="estiloImagemCarro" >
        </div>
</main>
 
<footer> 

    <section class="tabela-carros">
    <table> 

        <thead>

         <tr class="titulosCarro">     

            <th>Codigo-Vin</th> 
            <th>Odômetro</th>
            <th>Nivel de combustivel</th>
            <th>Status</th>
            <th>Lat.</th>
            <th>Long.</th>
        
        </tr>  
        
        </thead>

        <tbody>
            
            <tr class="dadosCarro">

            <input type="text" placeholder="insira o Código">
            <td>5000km</td>
            <td>90%</td>
            <td>on</td>
            <td>-12,23222</td>
            <td>35,2314</td>
        
            </tr>
            
            <tr class="parte-inferior">

                
            </tr>
      
        </tbody>
    </table>

    </section>
    
</footer>

</body>
